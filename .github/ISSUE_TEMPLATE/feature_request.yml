name: Feature request
description: Something CLIP//NET should do, especially a Ditto feature it's missing.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem or workflow, before any particular solution.
      placeholder: When I copy a table from a spreadsheet I'd like to…
    validations:
      required: true
  - type: textarea
    id: ditto
    attributes:
      label: How Ditto does it (if it does)
      description: The Ditto option, menu or key, and how it behaves. CLIP//NET aims to match Ditto where it makes sense.
  - type: textarea
    id: proposal
    attributes:
      label: What you'd suggest
      description: How it could work in CLIP//NET, e.g. keys, settings, or a rule or script.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
      description: A rule, a Lua script, or a Hyprland binding that gets close?
